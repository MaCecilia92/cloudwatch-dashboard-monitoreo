AWSTemplateFormatVersion: '2010-09-09'   # Única versión válida del formato de plantilla (no es una fecha a actualizar)
Description: 'Servidor web EC2 en una VPC + Dashboard de CloudWatch (CPU, red, creditos y chequeos de estado)'
# Autora: Maria Cecilia Alegre
#
# Crea en un solo paso:
#   - una VPC 10.0.0.0/16 con una subred publica 10.0.1.0/24 (como en el Modulo 6),
#   - una EC2 t3.micro con Apache y un archivo de prueba para generar trafico,
#   - el dashboard "Servidor-Web-Monitoreo-Dashboard" ya apuntando a esa instancia.
# COSTO: la EC2 cobra por hora mientras exista. Borrar el stack al terminar.

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Ultima AMI de Amazon Linux 2023

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: vpc-desarrollo }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubredPublica:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: subred-publica }]

  TablaRutas:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  RutaInternet:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref TablaRutas
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AsociacionRutas:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPublica
      RouteTableId: !Ref TablaRutas

  SgWeb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP 80 desde internet (sin SSH, se usa Session Manager)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # Rol para entrar a la instancia con Session Manager (sin abrir el puerto 22).
  RolInstancia:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  PerfilInstancia:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RolInstancia]

  InstanciaWeb:
    Type: AWS::EC2::Instance
    DependsOn: RutaInternet
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      SubnetId: !Ref SubredPublica
      SecurityGroupIds: [!Ref SgWeb]
      IamInstanceProfile: !Ref PerfilInstancia
      Monitoring: false                 # monitoreo basico (cada 5 min, gratis). true = cada 1 min (con costo)
      MetadataOptions:
        HttpTokens: required            # IMDSv2 obligatorio
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y httpd
          echo "<h1>Servidor web en monitoreo</h1><p><a href='archivo-prueba.bin'>archivo de prueba (20 MB)</a></p>" > /var/www/html/index.html
          # Archivo para generar trafico de salida (NetworkOut) al descargarlo
          head -c 20M /dev/urandom > /var/www/html/archivo-prueba.bin
          systemctl enable --now httpd
      Tags: [{ Key: Name, Value: servidor-web-monitoreo }]

  # El cuerpo es el mismo JSON de dashboard/Servidor-Web-Monitoreo-Dashboard.json,
  # con el ID de la instancia completado automaticamente (${InstanciaWeb}).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: Servidor-Web-Monitoreo-Dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 3,
              "properties": {
                "markdown": "## Servidor web · monitoreo en tiempo real\nInstancia **${InstanciaWeb}** (t3.micro) en la subred pública de la VPC del Módulo 6. Métricas estándar de EC2 cada **5 minutos** (monitoreo básico, sin costo). [Qué significa cada gráfico](https://github.com/MaCecilia92/cloudwatch-dashboard-monitoreo#qué-muestra-cada-widget)"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 3,
              "width": 12,
              "height": 7,
              "properties": {
                "title": "CPU del servidor web (%) · CPUUtilization",
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  [
                    "AWS/EC2",
                    "CPUUtilization",
                    "InstanceId",
                    "${InstanciaWeb}",
                    {
                      "label": "CPU promedio (%)",
                      "color": "#ff7f0e"
                    }
                  ],
                  [
                    "...",
                    {
                      "stat": "Maximum",
                      "label": "CPU máxima (%)",
                      "color": "#d62728"
                    }
                  ]
                ],
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 100,
                    "label": "Porcentaje",
                    "showUnits": false
                  }
                },
                "annotations": {
                  "horizontal": [
                    {
                      "label": "Umbral de Auto Scaling (60 %)",
                      "value": 60,
                      "color": "#d62728"
                    },
                    {
                      "label": "Línea base t3.micro (10 %)",
                      "value": 10,
                      "color": "#2ca02c",
                      "fill": "below"
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 3,
              "width": 12,
              "height": 7,
              "properties": {
                "title": "Tráfico de red (bytes cada 5 min) · NetworkIn / NetworkOut",
                "view": "timeSeries",
                "stacked": true,
                "region": "us-east-1",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/EC2",
                    "NetworkIn",
                    "InstanceId",
                    "${InstanciaWeb}",
                    {
                      "label": "Entrada: lo que recibe el servidor",
                      "color": "#1f77b4"
                    }
                  ],
                  [
                    ".",
                    "NetworkOut",
                    ".",
                    ".",
                    {
                      "label": "Salida: lo que envía (páginas, archivos)",
                      "color": "#9467bd"
                    }
                  ]
                ],
                "yAxis": {
                  "left": {
                    "min": 0,
                    "label": "Bytes",
                    "showUnits": false
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 10,
              "width": 8,
              "height": 5,
              "properties": {
                "title": "Créditos de CPU disponibles · CPUCreditBalance",
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  [
                    "AWS/EC2",
                    "CPUCreditBalance",
                    "InstanceId",
                    "${InstanciaWeb}",
                    {
                      "label": "Créditos acumulados",
                      "color": "#2ca02c"
                    }
                  ],
                  [
                    ".",
                    "CPUCreditUsage",
                    ".",
                    ".",
                    {
                      "label": "Créditos usados en el período",
                      "color": "#ff7f0e"
                    }
                  ]
                ],
                "yAxis": {
                  "left": {
                    "min": 0,
                    "label": "Créditos",
                    "showUnits": false
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 10,
              "width": 8,
              "height": 5,
              "properties": {
                "title": "Chequeos de estado (0 = OK, 1 = falla)",
                "view": "singleValue",
                "region": "us-east-1",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/EC2",
                    "StatusCheckFailed_System",
                    "InstanceId",
                    "${InstanciaWeb}",
                    {
                      "label": "Sistema (hardware de AWS)"
                    }
                  ],
                  [
                    ".",
                    "StatusCheckFailed_Instance",
                    ".",
                    ".",
                    {
                      "label": "Instancia (sistema operativo)"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 10,
              "width": 8,
              "height": 5,
              "properties": {
                "title": "Paquetes de red por período",
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/EC2",
                    "NetworkPacketsIn",
                    "InstanceId",
                    "${InstanciaWeb}",
                    {
                      "label": "Paquetes que entran"
                    }
                  ],
                  [
                    ".",
                    "NetworkPacketsOut",
                    ".",
                    ".",
                    {
                      "label": "Paquetes que salen"
                    }
                  ]
                ],
                "yAxis": {
                  "left": {
                    "min": 0,
                    "label": "Paquetes",
                    "showUnits": false
                  }
                }
              }
            }
          ]
        }

Outputs:
  InstanciaId:
    Value: !Ref InstanciaWeb
  UrlServidor:
    Description: Abrir en el navegador (http)
    Value: !Sub 'http://${InstanciaWeb.PublicDnsName}'
  UrlDashboard:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/Servidor-Web-Monitoreo-Dashboard'
